# Facebook Hub: API + background worker sharing one persistent SQLite volume.
# Usage on a server (from the backend/ folder):
#   cp .env.example .env   # then fill in the values (never commit .env)
#   docker compose up -d --build
# Optional HTTPS with Caddy (needs SITE_DOMAIN in .env pointing to this server):
#   docker compose --profile https up -d --build
services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/jobs.sqlite3
      FACEBOOK_HUB_DB: /app/data/hub.sqlite3
      OUTPUT_DIR: /app/output
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  hub-worker:
    build: .
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/jobs.sqlite3
      FACEBOOK_HUB_DB: /app/data/hub.sqlite3
      OUTPUT_DIR: /app/output
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "app.hub_runner"]
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2
    profiles: ["https"]
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped
    depends_on:
      - api

volumes:
  caddy_data:
